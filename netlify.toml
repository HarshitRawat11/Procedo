# ⚠️ SUPERSEDED 2026-09-18 — the preview is moving to Cloudflare Pages.
#
# Kept until the Cloudflare project is live and verified, so there is something
# to fall back to; delete it, and disconnect the repo in the Netlify dashboard,
# once the cutover is confirmed. While the repo is still connected, every push
# keeps triggering a Netlify build that is skipped for "account credit usage
# exceeded" — harmless noise, but that is what those failures are.
#
# What replaced each part of this file:
#   [build]                  → Cloudflare project settings (build command
#                              `npm run build`, output directory `dist`)
#   NODE_VERSION             → same, as a Pages environment variable
#   [[headers]] security     → public/_headers
#   [[headers]] _astro cache → public/_headers
#   X-Robots-Tag noindex     → scripts/preview-headers.cjs, NOT public/_headers,
#                              and the reason is the whole point — see below.
#
# THE ONE THING THAT DOES NOT PORT CLEANLY. This file works as a preview-only
# config precisely because it sits at the repo root and is never copied into
# dist/. Cloudflare Pages has no root-level config for headers; its only
# mechanism is a `_headers` file inside the build output, which means anything
# in it ships wherever the build ships. So the noindex is appended to
# dist/_headers at deploy time instead, by a script that `npm run build` does
# not run. Same guarantee, reached a different way.
#
# ── the original notes follow ───────────────────────────────────────────────
#
# Netlify config — for the CLIENT PREVIEW deploy, not production.
#
# Purpose: give the client a stable URL that rebuilds on every push to master,
# so they can review as work lands. The real site still lives at
# procedoinfo.com and is untouched by this.
#
# Deliberately NOT a public launch:
#   - every response carries X-Robots-Tag: noindex, nofollow, so search engines
#     never index the preview. This matters twice over — the legal pages have
#     not been through review yet (#5), and an indexed preview would compete
#     with procedoinfo.com.
#   - the noindex lives here rather than in public/robots.txt on purpose. A
#     robots.txt in public/ would be copied into dist/ and would follow the
#     site into production, quietly de-indexing the real launch.
#
# `site` in astro.config.mjs still points at https://www.procedoinfo.com, so
# canonical tags on the preview point at the production domain. That is correct
# and is a second layer of protection against the preview being indexed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 6 needs >= 18.20.8 / 20.3 / 22. Local dev runs Node 24; 22 is the
  # safest widely-supported choice on Netlify. Raise it if a build ever needs to.
  NODE_VERSION = "22"

# Keep the whole preview out of search results.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long-cache the fingerprinted build assets; Astro hashes these filenames.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
